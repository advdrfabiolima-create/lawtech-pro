<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Portal do Cliente</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .header {
            background: #1E3A5F;
            padding: 32px 28px 24px;
            text-align: center;
        }
        .header img {
            max-height: 64px;
            max-width: 220px;
            object-fit: contain;
            margin-bottom: 14px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 4px;
            line-height: 1.3;
        }
        .header p {
            color: #93c5fd;
            font-size: 13px;
            margin: 0;
        }
        .body {
            padding: 28px 28px 32px;
        }
        .subtitle {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: center;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            font-family: monospace;
            letter-spacing: 0.1em;
            color: #1e293b;
            transition: border-color 0.2s;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1E3A5F;
            box-shadow: 0 0 0 3px rgba(30,58,95,0.1);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            background: #1E3A5F;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn:hover { background: #163152; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg {
            display: none;
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }
        .msg.success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #15803d;
        }
        .msg.error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
        }
        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }
        .footer a { color: #64748b; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        #loading { display: block; text-align: center; padding: 20px; color: #93c5fd; font-size: 14px; }
        #escritorio-not-found {
            display: none;
            text-align: center;
            padding: 24px 12px;
            color: #fca5a5;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header" id="header">
        <div id="loading">Carregando...</div>
        <div id="escritorio-not-found">Escritório não encontrado.</div>
        <div id="header-content" style="display:none;">
            <img id="logo-img" src="" alt="Logo" style="display:none;">
            <h1 id="escritorio-nome"></h1>
            <p>Portal do Cliente</p>
        </div>
    </div>

    <div class="body" id="form-area" style="display:none;">
        <p class="subtitle">
            Digite o seu <strong>CPF</strong> para receber o link de acesso ao seu portal por e-mail.
        </p>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off" inputmode="numeric">

        <button class="btn" id="btnSolicitar">Enviar link por e-mail</button>

        <div class="msg" id="msg"></div>
    </div>
</div>

<div class="footer">
    Desenvolvido por <a href="https://www.lawtechpro.com.br" target="_blank" rel="noopener">LawTech Pro</a>
</div>

<script src="/js/acesso-portal.js"></script>
</body>
</html>
