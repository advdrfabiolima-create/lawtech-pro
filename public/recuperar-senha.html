<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha — LawTech Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #0f172a; margin-bottom: 10px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .back-link { display: block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 13px; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <div class="card">
        <h2>Recuperar Senha</h2>
        <p id="msg">Insira seu e-mail cadastrado para receber as instruções de recuperação.</p>
        <div id="formArea">
            <input type="email" id="emailRecuperar" placeholder="seu@email.com">
            <button class="btn" id="btnEnviar" onclick="solicitarLink()">Enviar Instruções</button>
        </div>
        <a href="/login.html" class="back-link">← Voltar para o Login</a>
    </div>
    <script>
        async function solicitarLink() {
            const email = document.getElementById('emailRecuperar').value.trim();
            if (!email) {
                alert('Informe seu e-mail.');
                return;
            }

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const res = await fetch('/api/auth/recuperar-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok && data.ok) {
                    document.getElementById('formArea').style.display = 'none';
                    document.getElementById('msg').innerHTML =
                        '✅ Instruções enviadas! Verifique sua caixa de entrada (e o spam).<br><br>' +
                        '<small style="color:#94a3b8;">O link expira em 1 hora.</small>';
                } else {
                    alert(data.erro || 'Erro ao processar solicitação.');
                    btn.disabled = false;
                    btn.textContent = 'Enviar Instruções';
                }
            } catch (e) {
                alert('Erro de conexão. Tente novamente.');
                btn.disabled = false;
                btn.textContent = 'Enviar Instruções';
            }
        }

        document.getElementById('emailRecuperar').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') solicitarLink();
        });
    </script>
    <script src="mobile.js"></script>
</body>
</html>
