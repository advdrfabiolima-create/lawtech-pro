<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal do Cliente — LawTech Pro</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ---- Header ---- */
        .portal-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 1px solid #334155;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand .logo-circle {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .header-brand .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .header-brand .escritorio-nome {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .header-brand .escritorio-advogado {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .header-cliente {
            text-align: left;
        }

        .header-cliente .saudacao {
            font-size: 14px;
            color: #94a3b8;
        }

        .header-cliente .cliente-nome {
            font-size: 16px;
            font-weight: 600;
            color: #3b82f6;
        }

        /* ---- Container ---- */
        .portal-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ---- Section title ---- */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }

        /* ---- Process card ---- */
        .processo-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .processo-card:hover {
            border-color: #3b82f6;
        }

        .processo-header {
            padding: 18px 22px;
            cursor: pointer;
            user-select: none;
        }

        .processo-info {
            flex: 1;
        }

        .processo-numero {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 15px;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .processo-meta {
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meta-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-ativo { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        .status-arquivado { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
        .status-suspenso { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

        .toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #3b82f6;
            white-space: nowrap;
            padding: 5px 12px;
            background: rgba(59,130,246,0.1);
            border-radius: 6px;
            border: 1px solid rgba(59,130,246,0.2);
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-btn:hover { background: rgba(59,130,246,0.2); }

        .toggle-icon { transition: transform 0.25s; font-size: 14px; }
        .toggle-icon.open { transform: rotate(180deg); }

        /* ---- Andamentos timeline ---- */
        .andamentos-container {
            display: none;
            border-top: 1px solid #334155;
            padding: 20px 22px;
            background: #0f172a;
        }

        .andamentos-container.open { display: block; }

        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #1e293b;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item:last-child { margin-bottom: 0; }

        .timeline-dot {
            position: absolute;
            left: -17px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3b82f6;
            border: 2px solid #0f172a;
            z-index: 1;
        }

        .timeline-date {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }

        .timeline-tipo {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }

        /* Tipo badge — styled via inline style in JS */

        .timeline-titulo {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
        }

        .timeline-descricao {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .sem-andamentos {
            text-align: center;
            color: #475569;
            font-size: 13px;
            padding: 16px 0;
        }

        /* ---- Empty state ---- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #475569;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .empty-state p { font-size: 14px; }

        /* ---- Error screen ---- */
        #telaErro {
            display: none;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 40px 24px;
        }

        #telaErro.show { display: flex; }

        .erro-icon { font-size: 56px; margin-bottom: 20px; }

        .erro-titulo {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        .erro-msg {
            font-size: 15px;
            color: #94a3b8;
            max-width: 420px;
            line-height: 1.6;
        }

        /* ---- Loading ---- */
        #telaLoading {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Footer ---- */
        .portal-footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: #334155;
            border-top: 1px solid #1e293b;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
        }

        /* ---- Modal Jitsi Portal ---- */
        .portal-video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; }
        .portal-video-overlay.show { display: flex; }
        .portal-video-box { background: #0f172a; border-radius: 12px; width: 96%; max-width: 1100px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
        .portal-video-header { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); background: #1e293b; flex-shrink: 0; }
        #portalJitsiContainer { flex: 1; min-height: 0; }
        #portalJitsiContainer iframe { width: 100% !important; height: 100% !important; border: none !important; }
        .portal-jitsi-fallback { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8; gap: 14px; text-align: center; padding: 32px; }

        /* ---- Reunião cards ---- */
        .reuniao-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .reuniao-info { flex: 1; min-width: 0; }
        .reuniao-titulo { font-size: 15px; font-weight: 600; color: #e2e8f0; margin-bottom: 4px; }
        .reuniao-meta { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .badge-reuniao { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-agendada { background: #1d4ed822; color: #60a5fa; border: 1px solid #1d4ed844; }
        .badge-concluida { background: #33415530; color: #94a3b8; }
        .btn-entrar-reuniao { background: #6366f1; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; white-space: nowrap; }
        .btn-entrar-reuniao:hover { background: #4f46e5; }

        /* ---- Main content wrapper ---- */
        #telaPortal { display: none; }
        #telaPortal.show { display: block; }

        @media (max-width: 600px) {
            .portal-header { padding: 16px; }
            .portal-container { padding: 24px 16px 80px; }
            .processo-numero { font-size: 13px; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="telaLoading">
    <div class="spinner"></div>
    <div style="color:#64748b;font-size:14px;">Carregando portal...</div>
</div>

<!-- Error -->
<div id="telaErro">
    <div class="erro-icon">🔒</div>
    <div class="erro-titulo">Acesso não autorizado</div>
    <div class="erro-msg" id="erroMsg">Link expirado ou inválido. Solicite um novo link ao seu advogado.</div>
</div>

<!-- Portal content -->
<div id="telaPortal">
    <header class="portal-header">
        <div class="header-brand">
            <div class="logo-circle" id="logoBox">
                <img id="logoImg" src="" alt="logo" style="display:none;">
                <span id="logoIniciais">L</span>
            </div>
            <div>
                <div class="escritorio-nome" id="escritorioNome">Escritório</div>
                <div class="escritorio-advogado" id="escritorioAdvogado"></div>
            </div>
        </div>
        <div class="header-cliente">
            <div class="saudacao">Olá,</div>
            <div class="cliente-nome" id="clienteNome">—</div>
        </div>
    </header>

    <div class="portal-container">
        <div class="section-title">Meus Processos</div>
        <div id="listaProcessos">
            <!-- cards rendered here -->
        </div>

        <div class="section-title" style="margin-top:40px;">Minhas Reuniões</div>
        <div id="listaReunioes">
            <div style="color:#64748b;font-size:14px;padding:20px 0;">Carregando...</div>
        </div>

        <!-- Modal Videochamada Jitsi IFrame API -->
        <div class="portal-video-overlay" id="portalVideoModal">
            <div class="portal-video-box">
                <div class="portal-video-header">
                    <span id="portalVideoTitulo" style="font-weight:700;color:#e2e8f0;font-size:14px;">Reunião</span>
                    <div style="display:flex;gap:8px;">
                        <button onclick="abrirPortalVideoNovaAba()" style="background:#1e3a5f;color:#94a3b8;border:1px solid #334155;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;">↗ Nova aba</button>
                        <button onclick="fecharPortalVideo()" style="background:#334155;color:#e2e8f0;border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;">✕ Fechar</button>
                    </div>
                </div>
                <div id="portalJitsiContainer"></div>
                <div class="portal-jitsi-fallback" id="portalJitsiFallback">
                    <p>Não foi possível carregar a videochamada aqui.</p>
                    <button onclick="abrirPortalVideoNovaAba()" style="background:#6366f1;color:white;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">↗ Abrir em nova aba</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="portal-footer">
    Desenvolvido por <strong>LawTech Pro</strong> · Portal do Cliente
</footer>

<script>
    const TIPO_META = {
        distribuicao: { label: 'Distribuição',      cor: '#0ea5e9' },
        despacho:     { label: 'Despacho',          cor: '#64748b' },
        decisao:      { label: 'Decisão',           cor: '#3b82f6' },
        sentenca:     { label: 'Sentença',          cor: '#7c3aed' },
        acordao:      { label: 'Acórdão',           cor: '#6366f1' },
        peticao:      { label: 'Petição',           cor: '#16a34a' },
        audiencia:    { label: 'Audiência',         cor: '#f97316' },
        recurso:      { label: 'Recurso',           cor: '#ca8a04' },
        citacao:      { label: 'Citação/Intimação', cor: '#0d9488' },
        certidao:     { label: 'Certidão',          cor: '#a855f7' },
        contestacao:  { label: 'Contestação',       cor: '#f43f5e' },
        alvara:       { label: 'Alvará',            cor: '#10b981' },
        arquivamento: { label: 'Arquivamento',      cor: '#78716c' },
        outros:       { label: 'Outros',            cor: '#94a3b8' }
    };

    function tipoMeta(tipo) {
        if (!tipo) return TIPO_META.outros;
        return TIPO_META[tipo] || { label: tipo, cor: '#94a3b8' };
    }

    const STATUS_LABELS = {
        ativo: 'Ativo',
        arquivado: 'Arquivado',
        suspenso: 'Suspenso',
        encerrado: 'Encerrado'
    };

    let portalToken = null;

    function formatarData(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr + (dateStr.includes('T') ? '' : 'T00:00:00'));
        return d.toLocaleDateString('pt-BR');
    }

    function getStatusClass(status) {
        if (status === 'ativo') return 'status-ativo';
        if (status === 'arquivado') return 'status-arquivado';
        return 'status-suspenso';
    }

    function getStatusLabel(status) {
        return STATUS_LABELS[status] || status || '—';
    }

    function mostrarErro(msg) {
        document.getElementById('telaLoading').style.display = 'none';
        const telaErro = document.getElementById('telaErro');
        if (msg) document.getElementById('erroMsg').textContent = msg;
        telaErro.classList.add('show');
    }

    async function autenticarPortal(token) {
        try {
            const res = await fetch('/api/portal/autenticar?token=' + encodeURIComponent(token));
            const data = await res.json();

            if (!data.ok) {
                mostrarErro(data.erro || 'Link inválido ou expirado. Solicite um novo ao seu advogado.');
                return;
            }

            portalToken = data.token;
            sessionStorage.setItem('portalToken', portalToken);

            // Preenche header
            document.getElementById('clienteNome').textContent = data.nome || '—';

            const nomeEsc = data.escritorio?.nome || 'Escritório';
            document.getElementById('escritorioNome').textContent = nomeEsc;
            if (data.escritorio?.advogado) {
                document.getElementById('escritorioAdvogado').textContent = 'Dr(a). ' + data.escritorio.advogado;
            }

            // Logo ou iniciais — prioriza base64 (persiste no banco entre deploys)
            const logoBase64  = data.escritorio?.logo_base64;
            const logoArquivo = data.escritorio?.logo_arquivo;
            const logoImg     = document.getElementById('logoImg');
            const logoIniciais = document.getElementById('logoIniciais');
            const logoSrc = logoBase64 || (logoArquivo ? '/' + logoArquivo : null);
            if (logoSrc) {
                logoImg.src = logoSrc;
                logoImg.style.display = 'block';
                logoIniciais.style.display = 'none';
                logoImg.onerror = () => {
                    logoImg.style.display = 'none';
                    logoIniciais.style.display = 'block';
                    const iniciais = nomeEsc.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
                    logoIniciais.textContent = iniciais || 'L';
                };
            } else {
                const iniciais = nomeEsc.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
                logoIniciais.textContent = iniciais || 'L';
            }

            document.getElementById('telaLoading').style.display = 'none';
            document.getElementById('telaPortal').classList.add('show');

            await carregarProcessos();
            await carregarReunioes();
        } catch (err) {
            console.error('[Portal] Erro ao autenticar:', err);
            mostrarErro('Não foi possível conectar ao servidor. Tente novamente mais tarde.');
        }
    }

    async function carregarProcessos() {
        const lista = document.getElementById('listaProcessos');
        lista.innerHTML = '<div style="color:#64748b;font-size:14px;padding:20px 0;">Carregando...</div>';

        try {
            const res = await fetch('/api/portal/meus-processos', {
                headers: { 'Authorization': 'Bearer ' + portalToken }
            });
            const data = await res.json();

            if (!data.ok) {
                lista.innerHTML = '<div class="empty-state"><div class="icon">📂</div><h3>Sem processos</h3><p>' + (data.erro || 'Nenhum processo encontrado.') + '</p></div>';
                return;
            }

            const processos = data.processos || [];

            if (processos.length === 0) {
                lista.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <h3>Nenhum processo encontrado</h3>
                        <p>Seus processos aparecerão aqui quando forem cadastrados pelo escritório.</p>
                    </div>`;
                return;
            }

            lista.innerHTML = processos.map(p => renderProcessoCard(p)).join('');
        } catch (err) {
            console.error('[Portal] Erro ao carregar processos:', err);
            lista.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Erro ao carregar</h3><p>Tente recarregar a página.</p></div>';
        }
    }

    function renderProcessoCard(p) {
        const statusClass = getStatusClass(p.status);
        const statusLabel = getStatusLabel(p.status);
        const esfera = p.esfera ? `<span class="meta-tag">${p.esfera}</span>` : '';
        const instancia = p.instancia ? `<span class="meta-tag">${p.instancia}</span>` : '';
        const tribunal = p.tribunal ? `<span class="meta-tag">${p.tribunal}</span>` : '';
        const uf = p.uf ? `<span class="meta-tag">${p.uf}</span>` : '';

        return `
        <div class="processo-card" id="card-${p.id}">
            <div class="processo-header" onclick="toggleAndamentos(${p.id}, this)">
                <div class="processo-info">
                    <div class="processo-numero">${p.numero || '—'}</div>
                    <div class="processo-meta">
                        ${tribunal}${esfera}${instancia}${uf}
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                        <span class="toggle-btn">
                            <span>Ver Andamentos</span>
                            <span class="toggle-icon" id="icon-${p.id}">▼</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="andamentos-container" id="andamentos-${p.id}">
                <div style="color:#64748b;font-size:13px;">Carregando andamentos...</div>
            </div>
        </div>`;
    }

    async function toggleAndamentos(processoId, headerEl) {
        const container = document.getElementById('andamentos-' + processoId);
        const icon = document.getElementById('icon-' + processoId);
        const isOpen = container.classList.contains('open');

        if (isOpen) {
            container.classList.remove('open');
            icon.classList.remove('open');
            return;
        }

        container.classList.add('open');
        icon.classList.add('open');

        // Only load once
        if (container.dataset.loaded === 'true') return;

        try {
            const res = await fetch('/api/portal/processos/' + processoId + '/andamentos', {
                headers: { 'Authorization': 'Bearer ' + portalToken }
            });
            const data = await res.json();

            if (!data.ok) {
                container.innerHTML = '<div class="sem-andamentos">Não foi possível carregar os andamentos.</div>';
                return;
            }

            const andamentos = data.andamentos || [];
            container.dataset.loaded = 'true';

            if (andamentos.length === 0) {
                container.innerHTML = '<div class="sem-andamentos">Nenhum andamento disponível no momento.</div>';
                return;
            }

            const html = `
                <div class="timeline">
                    ${andamentos.map(a => {
                        const meta = tipoMeta(a.tipo);
                        const cor = meta.cor;
                        const bg = cor + '22'; // ~13% opacity hex suffix
                        return `
                        <div class="timeline-item">
                            <div class="timeline-dot" style="background:${cor};"></div>
                            <div class="timeline-date">${formatarData(a.data_andamento)}</div>
                            <span class="timeline-tipo" style="background:${bg};color:${cor};">${meta.label}</span>
                            <div class="timeline-titulo">${escapeHtml(a.titulo)}</div>
                            ${a.descricao ? `<div class="timeline-descricao">${escapeHtml(a.descricao)}</div>` : ''}
                        </div>`;
                    }).join('')}
                </div>`;

            container.innerHTML = html;
        } catch (err) {
            console.error('[Portal] Erro ao carregar andamentos:', err);
            container.innerHTML = '<div class="sem-andamentos">Erro ao carregar andamentos.</div>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ---- Reuniões ----
    async function carregarReunioes() {
        const lista = document.getElementById('listaReunioes');
        lista.innerHTML = '<div style="color:#64748b;font-size:14px;padding:20px 0;">Carregando...</div>';
        try {
            const res = await fetch('/api/portal/reunioes', {
                headers: { 'Authorization': 'Bearer ' + portalToken }
            });
            const data = await res.json();
            const reunioes = data.reunioes || [];
            if (reunioes.length === 0) {
                lista.innerHTML = '<div style="color:#64748b;font-size:14px;padding:20px 0;">Nenhuma reunião agendada pelo escritório.</div>';
                return;
            }
            lista.innerHTML = reunioes.map(r => {
                const dt = new Date(r.data_hora);
                const dataFmt = dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
                const badge = r.status === 'agendada'
                    ? '<span class="badge-reuniao badge-agendada">Agendada</span>'
                    : '<span class="badge-reuniao badge-concluida">Concluída</span>';
                const btnEntrar = r.status === 'agendada'
                    ? `<button class="btn-entrar-reuniao" onclick="entrarReuniaoPortal(${r.id}, '${r.titulo.replace(/'/g, "\\'")}')">▶ Entrar na Reunião</button>`
                    : '';
                return `
                    <div class="reuniao-card">
                        <div class="reuniao-info">
                            <div class="reuniao-titulo">${escapeHtml(r.titulo)}</div>
                            <div class="reuniao-meta">
                                <span>${dataFmt}</span>
                                <span>·</span>
                                <span>${r.duracao_minutos || 60} min</span>
                                ${badge}
                            </div>
                            ${r.descricao ? `<div style="font-size:13px;color:#94a3b8;margin-top:6px;">${escapeHtml(r.descricao)}</div>` : ''}
                        </div>
                        ${btnEntrar}
                    </div>`;
            }).join('');
        } catch (e) {
            lista.innerHTML = '<div style="color:#f87171;font-size:14px;padding:20px 0;">Erro ao carregar reuniões.</div>';
        }
    }

    let _portalRoomUrl = null;
    let _portalJitsiApi = null;

    async function entrarReuniaoPortal(id, titulo) {
        try {
            const res = await fetch(`/api/portal/reunioes/${id}/token`, {
                headers: { 'Authorization': 'Bearer ' + portalToken }
            });
            const data = await res.json();
            if (!data.ok) {
                alert(data.erro || 'Não foi possível acessar a sala. Tente novamente.');
                return;
            }

            _portalRoomUrl = data.room_url;
            document.getElementById('portalVideoTitulo').textContent = titulo || 'Reunião';
            document.getElementById('portalVideoModal').classList.add('show');

            iniciarJitsiPortal(data.room_url);
        } catch (e) {
            alert('Erro de conexão. Tente novamente.');
        }
    }

    function iniciarJitsiPortal(roomUrl) {
        if (_portalJitsiApi) { try { _portalJitsiApi.dispose(); } catch(_) {} _portalJitsiApi = null; }

        const container = document.getElementById('portalJitsiContainer');
        container.innerHTML = '';
        container.style.display = 'block';
        document.getElementById('portalJitsiFallback').style.display = 'none';

        const roomName = roomUrl.split('/').pop();

        if (typeof JitsiMeetExternalAPI === 'undefined') {
            document.getElementById('portalJitsiContainer').style.display = 'none';
            document.getElementById('portalJitsiFallback').style.display = 'flex';
            return;
        }

        try {
            _portalJitsiApi = new JitsiMeetExternalAPI('meet.jit.si', {
                roomName,
                parentNode: container,
                width: '100%',
                height: '100%',
                configOverwrite: {
                    startWithVideoMuted: false,
                    startWithAudioMuted: false,
                    prejoinPageEnabled: false,
                    disableDeepLinking: true,
                    requireDisplayName: false,
                    lobby: { enable: false, autoKnock: false },
                    hideConferenceSubject: true,
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    SHOW_BRAND_WATERMARK: false,
                    SHOW_POWERED_BY: false,
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'desktop', 'fullscreen',
                        'fodeviceselection', 'hangup', 'chat', 'tileview',
                    ],
                }
            });
            _portalJitsiApi.on('videoConferenceLeft', () => fecharPortalVideo());
        } catch (err) {
            console.error('[Jitsi Portal] Erro:', err);
            container.style.display = 'none';
            document.getElementById('portalJitsiFallback').style.display = 'flex';
        }
    }

    function abrirPortalVideoNovaAba() {
        if (_portalRoomUrl) window.open(_portalRoomUrl, '_blank');
    }

    function fecharPortalVideo() {
        document.getElementById('portalVideoModal').classList.remove('show');
        if (_portalJitsiApi) { try { _portalJitsiApi.dispose(); } catch(_) {} _portalJitsiApi = null; }
        document.getElementById('portalJitsiContainer').innerHTML = '';
        document.getElementById('portalJitsiContainer').style.display = 'block';
        document.getElementById('portalJitsiFallback').style.display = 'none';
        _portalRoomUrl = null;
    }

    // ---- Bootstrap ----
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            mostrarErro('Nenhum token fornecido. Acesse este portal pelo link enviado pelo seu advogado.');
            return;
        }

        // Check if we already have a valid session token in sessionStorage
        const savedToken = sessionStorage.getItem('portalToken');
        if (savedToken) {
            // Try to use saved token — if fails, re-auth with URL token
            portalToken = savedToken;
            fetch('/api/portal/meus-processos', { headers: { 'Authorization': 'Bearer ' + savedToken } })
                .then(r => {
                    if (r.status === 401) {
                        sessionStorage.removeItem('portalToken');
                        return autenticarPortal(token);
                    }
                    return autenticarPortal(token); // re-auth anyway to refresh name/escritorio
                })
                .catch(() => autenticarPortal(token));
        } else {
            autenticarPortal(token);
        }
    });
</script>
