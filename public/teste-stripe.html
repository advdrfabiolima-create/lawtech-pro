<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>✅ Teste CORRETO - Stripe Elements</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #card-element {
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            margin-bottom: 10px;
        }
        #card-errors {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 20px;
            min-height: 20px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        .info-box {
            background: #dbeafe;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
            color: #1e40af;
        }
        pre {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Teste Stripe Elements <span class="badge">CORRETO</span></h1>
        <p class="subtitle">Método aprovado pelo Stripe (PCI Compliant)</p>
        
        <div class="info-box">
            <strong>🧪 Cartão de teste:</strong> 4242 4242 4242 4242<br>
            <strong>📅 Validade:</strong> Qualquer data futura (ex: 12/25)<br>
            <strong>🔒 CVC:</strong> Qualquer 3 dígitos (ex: 123)
        </div>
        
        <form id="payment-form">
            <label for="cardholder-name">Nome do Titular</label>
            <input 
                type="text" 
                id="cardholder-name" 
                placeholder="Maria Silva"
                value="Teste da Silva"
            >
            
            <label>Dados do Cartão</label>
            <div id="card-element"></div>
            <div id="card-errors"></div>
            
            <button type="submit" id="submit-button">
                🔐 Tokenizar Cartão
            </button>
        </form>
        
        <div id="result" class="result"></div>
    </div>

    
    <script src="/js/api.js"></script>
    <script src="/js/teste-stripe.js"></script>
</body>
</html>
