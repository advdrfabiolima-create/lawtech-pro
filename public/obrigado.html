  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro concluído | LawTech Pro</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: linear-gradient(135deg, #06080e 0%, #0d1a30 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      padding: 32px 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.55);
    }

    .check-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid rgba(34, 197, 94, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .check-circle svg {
      width: 36px;
      height: 36px;
      stroke: #22c55e;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.18s;
      letter-spacing: 0.02em;
    }

    .btn:hover { background: #1d4ed8; }

    .hint {
      margin-top: 20px;
      font-size: 0.82rem;
      color: #64748b;
    }

    .brand {
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand img { height: 36px; }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    @media (max-width: 540px) {
      .card { padding: 40px 28px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/logomarca_lawtechpro.png" alt="LawTech Pro" onerror="this.style.display='none'" />
      <span class="brand-name">LawTech Pro</span>
    </div>

    <div class="check-circle">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <h1>Conta criada com sucesso!</h1>

    <p class="subtitle">
      Seu teste gratuito de 7 dias já está ativo.<br />
      Acesse o painel agora e comece a organizar seu escritório.
    </p>

    <a href="/dashboard-modern" class="btn">Acessar o painel</a>

    <p class="hint">Você também receberá um e-mail de confirmação em breve.</p>
  </div>
</body>
</html>
