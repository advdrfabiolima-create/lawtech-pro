<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar E-mail — LawTech Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: #1E3A5F;
            padding: 32px 24px;
            text-align: center;
        }
        .header img { max-width: 180px; height: auto; }
        .header p { color: rgba(255,255,255,0.75); margin-top: 8px; font-size: 13px; }
        .body {
            padding: 40px 32px;
            text-align: center;
        }
        .icon { font-size: 56px; margin-bottom: 16px; }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1E3A5F;
            margin-bottom: 12px;
        }
        .msg {
            font-size: 15px;
            color: #4A5568;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            text-decoration: none;
            padding: 13px 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.92; }
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            padding: 16px 24px;
            text-align: center;
            background: #f8fafb;
            border-top: 1px solid #e2e8f0;
        }
        .footer p { color: #a0aec0; font-size: 11px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <img src="/Logo LawTech Pro_transparente.png" alt="LawTech Pro"
             onerror="this.style.display='none'">
        <p>Sistema Jurídico Inteligente</p>
    </div>
    <div class="body" id="content">
        <div class="spinner"></div>
        <p class="msg">Verificando seu e-mail...</p>
    </div>
    <div class="footer">
        <p>LawTech Pro — Sistema Jurídico Inteligente</p>
    </div>
</div>


    <script src="/js/api.js"></script>
    <script src="/js/verificar-email.js"></script>
</body>
</html>
